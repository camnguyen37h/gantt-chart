<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Project Management Dashboard" />
    <title>Project Management System</title>
    <script>
      // ==================== PROCESS POLYFILL ====================
      (function() {
        if (typeof window.process === 'undefined') {
          window.process = {};
        }
        if (typeof window.process.env === 'undefined') {
          window.process.env = {};
        }
        window.process.env.NODE_ENV = 'development';
        window.process.version = 'v16.0.0';
        window.process.versions = { node: '16.0.0' };
        window.process.browser = true;
      })();
      
      // ==================== MOCK STORAGE INITIALIZATION ====================
      (function initializeMockData() {
        // Mock User Data
        const mockUser = {
          id: 3860,
          userId: 3860,
          ldap: 'ttlam1',
          userName: 'Lam. Tran Tung',
          fullName: 'Lam. Tran Tung',
          email: 'ttlam1@cmcglobal.vn',
          firstName: 'Tung',
          lastName: 'Lam',
          departmentId: 2,
          departmentName: 'DJ2',
          departmentCode: 'DJ2',
          position: 'SE02',
          positionId: 803,
          role: 'PM',
          roles: ['USER', 'PM', 'BUSINESS_PLAN_ADMIN'],
          isActive: true,
          location: 'Vietnam',
          employeeType: 'In-house',
          grossSalary: 5000000
        };
        
        // Mock User POA (Power of Attorney)
        const mockUserPOA = {
          userName: mockUser.userName,
          userId: mockUser.userId,
          ldap: mockUser.ldap,
          email: mockUser.email,
          departmentId: mockUser.departmentId,
          departmentName: mockUser.departmentName,
          roles: mockUser.roles
        };
        
        // Mock Permissions - structured format required by checkRolePermission()
        // Format: [{ key: SourceConstants.xxx, activities: [{ name: ActivityKeyConstants.xxx }] }]
        const mockPermissions = [
          {
            key: '/delivery/business-plan-list',
            activities: [
              { name: 'EXPORT_BUSINESS_PLAN' },
            ]
          },
          {
            key: '/delivery/business-plan-list/{buId}/business-plan-detail',
            activities: [
              { name: 'EDIT_BUSINESS_PLAN' },
              { name: 'EDIT_BUSINESS_PLAN_ALL' },
              { name: 'EDIT_DOCUMENT_ALL' },
              { name: 'EDIT_DOCUMENT_DU' },
              { name: 'CREATE_NEW_VERSION' },
              { name: 'EXPORT_BUSINESS_PLAN' },
              { name: 'SUBMIT_BUSINESS_PLAN' },
              { name: 'EDIT_REVENUE_PLAN_ALL_STATUS' },
              { name: 'EDIT_DELIVERY_PLAN_ALL_STATUS' },
            ]
          },
        ];
        
        // Mock Tokens
        const mockAccessToken = 'mock_access_token_' + Date.now();
        const mockRefreshToken = 'mock_refresh_token_' + Date.now();
        
        // Mock API Base URLs
        const mockApiConfig = {
          API_SALE: 'http://localhost:3001/api/sale',
          API_CRM: 'http://localhost:3001/api/crm',
          API_DELIVERY: 'http://localhost:3001/api/delivery'
        };
        
        // ==================== SET LOCALSTORAGE ====================
        if (!localStorage.getItem('user')) {
          localStorage.setItem('user', JSON.stringify(mockUser));
          console.log('✅ Mock user initialized:', mockUser.ldap);
        }
        
        if (!localStorage.getItem('userPOA')) {
          localStorage.setItem('userPOA', JSON.stringify(mockUserPOA));
          console.log('✅ Mock userPOA initialized');
        }
        
        // Always overwrite permissions to ensure the correct structured format is used
        localStorage.setItem('permissions', JSON.stringify(mockPermissions));
        console.log('✅ Mock permissions initialized:', mockPermissions.length, 'entries');
        
        if (!localStorage.getItem('access_token')) {
          localStorage.setItem('access_token', mockAccessToken);
          console.log('✅ Mock access token initialized');
        }
        
        if (!localStorage.getItem('refresh_token')) {
          localStorage.setItem('refresh_token', mockRefreshToken);
          console.log('✅ Mock refresh token initialized');
        }
        
        if (!localStorage.getItem('api_config')) {
          localStorage.setItem('api_config', JSON.stringify(mockApiConfig));
          console.log('✅ Mock API config initialized');
        }
        
        // ==================== SET SESSIONSTORAGE ====================
        if (!sessionStorage.getItem('sessionUser')) {
          sessionStorage.setItem('sessionUser', JSON.stringify(mockUser));
          console.log('✅ Mock session user initialized');
        }
        
        // ==================== MOCK PERMISSION CHECKER ====================
        window.hasPermission = function(permission) {
          try {
            const perms = JSON.parse(localStorage.getItem('permissions') || '[]');
            const hasIt = perms.includes(permission);
            console.log('🔐 Permission check:', permission, hasIt ? '✅' : '❌');
            return hasIt;
          } catch (e) {
            console.error('❌ Permission check failed:', e);
            return true; // Default allow in mock mode
          }
        };
        
        window.hasAnyPermission = function(permissions) {
          try {
            const perms = JSON.parse(localStorage.getItem('permissions') || '[]');
            return permissions.some(p => perms.includes(p));
          } catch (e) {
            return true; // Default allow in mock mode
          }
        };
        
        window.hasAllPermissions = function(permissions) {
          try {
            const perms = JSON.parse(localStorage.getItem('permissions') || '[]');
            return permissions.every(p => perms.includes(p));
          } catch (e) {
            return true; // Default allow in mock mode
          }
        };
        
        // ==================== MOCK AUTH FUNCTIONS ====================
        window.mockAuth = {
          getCurrentUser: function() {
            try {
              return JSON.parse(localStorage.getItem('user'));
            } catch (e) {
              return null;
            }
          },
          
          getAccessToken: function() {
            return localStorage.getItem('access_token');
          },
          
          getRefreshToken: function() {
            return localStorage.getItem('refresh_token');
          },
          
          isAuthenticated: function() {
            return !!localStorage.getItem('access_token');
          },
          
          logout: function() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            sessionStorage.clear();
            console.log('✅ Mock logout completed');
          },
          
          refreshToken: async function() {
            const newToken = 'mock_access_token_' + Date.now();
            localStorage.setItem('access_token', newToken);
            console.log('✅ Mock token refreshed');
            return newToken;
          }
        };
        
        console.log('');
        console.log('========================================');
        console.log('🎭 MOCK SYSTEM INITIALIZED');
        console.log('========================================');
        console.log('User:', mockUser.ldap, '-', mockUser.fullName);
        console.log('Department:', mockUser.departmentName);
        console.log('Permissions:', mockPermissions.length);
        console.log('Mode: Standalone Mock');
        console.log('========================================');
        console.log('');
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
