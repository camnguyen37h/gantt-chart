<style>
  html {

  }

    img {

    }
    body {
      background-color: white;
    }
    ._container {

    }

  }

  }
  ._container {

    /*height: 1122px;*/
    background-color: white;

  }
  ._header {
    width: 100%;
    display: flex;
    justify-content: space-between;
  }
  ._header_logo {
    /*background: url("images/logo.png");*/
    width: 300px;
    height: 50px;
    background-size: contain;
    background-repeat: no-repeat;
    display: block;
  }

    font-size: 18px;
    line-height: 22px;

  }

  }

    font-size: 20px;
    font-weight: 700;
    border-bottom: 2px solid black;
  }
  .legend-secondary {
    font-size: 16px;
    font-weight: 500;
    border-bottom: 1px solid black;
    margin-top: 10px;
  }
  ._issue_info {
    display: flex;
    justify-content: space-between;
  }
  ._issue_info-content {
    width: 100%;
    float: left;
  }
  ._issue_info_qrCode {
    width: 180px;
    /*height: 177px !important;*/
    border: 4px solid black;
    background-size: contain;
    background-repeat: no-repeat;
    margin-top: 9px;
    padding-bottom: 2px;
  }

  ._issue_status-table {
    border-radius: 1px;
    font-size: 16px;
    line-height: 18px;
    font-weight: normal;
    border: 1px solid black;
    /* border-collapse: collapse; */
    width: 100%;
    white-space: nowrap;
    background-color: white;
    margin: 10px 10px 10px 0px;
    text-align: center;
  }
  .tblInfo tr td {
    margin-right: 10px;
  }
  ._issue_status-table td,
  .fl-table th {
    text-align: left !important;
    padding: 6px;
    word-wrap: break-word !important;
    word-break: break-word !important;
    white-space: normal !important;
  }

  ._issue_status-table td {
    border-right: 1px solid #c5c5c5;
    font-size: 14px;
    line-height: 18px;
    word-wrap: break-word !important;
    word-break: break-word !important;
    white-space: normal !important;
  }

  ._issue_status-table thead th {
    color: #3a3a3a;
    background: #a2cbe2;
    font-size: 16px;
    line-height: 26px;
  }
  ._issue_status-table thead th:nth-child(odd) {
    color: #111111;
    background: #a2cbe2;
  }

  ._issue_status-table tr:nth-child(even) {
    background: #e9e9e9;
  }
  ._issue_status-table tr:nth-child(odd) {
    background: #f8f8f8;
  }
  .business-plan-unit {
    text-align: center;
    padding: 10px 4px;
    border: 1px solid #000;
    width: 120px;
    float: right;
    margin-bottom: 14px;
  }
  .marginBottom {
    margin-bottom: 20px;
  }
  .narrow-column {
    width: 200px; /* Điều chỉnh chiều rộng theo nhu cầu */
    word-wrap: break-word;
    white-space: normal;
  }
  .du-bu-column {
    width: 70px;
  }
  footer {
    text-align: center;
  }
</style>
